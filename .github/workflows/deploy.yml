name: Deploy to GCP

on:
  push:
    branches: [main]

env:
  TF_VERSION: latest
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GCP Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="gcp_project=$GCP_PROJECT"

      - name: Force Unlock State (if needed)
        run: terraform force-unlock -force 1739398551870172
        if: ${{ failure() }}

      - name: Terraform Apply
        run: terraform apply -lock-timeout=5m -auto-approve -var="gcp_project=$GCP_PROJECT"
